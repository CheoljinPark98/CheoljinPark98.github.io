title: CJ Park's Github pages
author: CJ Park
email: qkr6871@gmail.com
description: > # this means to ignore newlines until "show_exerpts:"
  개발자로서 공부하면서 알게되는 내용들을 정리하기 위한 깃허브 페이지입니다.
show_excerpts: true # set to true to show excerpts on the homepage

# Minima date format
# refer to http://shopify.github.io/liquid/filters/date/ if you want to customize this
sass:
  sass_dir: _sass
plainwhite:

  name: Cheoljin Park
  tagline: Embedded Engineer
  date_format: "%b %-d, %Y"
  sitemap: true # set to true to generate sitemap.xml content
  search: true # set to true to enable searchbar
  dark_mode: true # set to true to add dark mode toggle
  portfolio_image: "assets/portfolio.jpg" # the path from the base directory of the site to the image to display (no / at the start)
  html_lang: "kr" # set the lang attribute of the <html> tag for the pages. See here for a list of codes: https://www.w3schools.com/tags/ref_country_codes.asp
  condensed_mobile:
    #- home
    - page
    - post
  # generate social links in footer
  social_links:
    #twitter: samarsault
    github:  CheoljinPark98
    #linkedIn: in/samarsault
    #dribbble: jekyll
    #flickr:   jekyll
    #instagram: jekyll
    #pinterest: jekyll
    #youtube: jekyll
    #facebook: jekyll
    #soundcloud: jekyll
    #telegram: jekyll
    #gitlab: jekyll
    #email: jekyll

    # Mastodon instances
    # mastodon:
    # - username: jekyll
    #   instance: example.com
    # - username: jekyll2
    #   instance: example.com
  navigation:
    # 이전에 설정한 My Work 등 기존 메뉴
    - title: My Work
      url: "/my-work"

    # 새로운 카테고리 메뉴 추가 (대소문자 및 슬래시 주의)
    - title: JavaScript
      url: "/category/javascript/" # jekyll-archives가 생성한 경로를 지정

    - title: NodeJS
      url: "/category/nodejs/"
# If you want to link only specific pages in your header, uncomment
# this and add the path to the pages in order as they should show up
#header_pages:
# - about.md

# Build settings
# theme: plainwhite
remote_theme: samarsault/plainwhite-jekyll

plugins:
  - jekyll-seo-tag
#  - jekyll-remote-theme
#  - jekyll-feed

jekyll-archives:
  enabled:
    - categories # 카테고리별 페이지 활성화
  layout: 'archive' # 사용할 레이아웃 지정 (테마에 따라 다름)
  permalinks:
    category: '/category/:name/' # 접속 주소 지정 (예: /category/Javascript/)

baseurl: ""